name: Linux 설치본 실행 검사
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 설치파일 빌드 Actions 실행 ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: 설치파일 받기
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          BUILD_SHA=$(gh run view "$BUILD_RUN" --json headSha --jq .headSha)
          gh run download "$BUILD_RUN" --name "motungi-radio-linux-x64-$BUILD_SHA" --dir dist-packages/linux-x64
          cd dist-packages/linux-x64
          sha256sum --check SHA256SUMS.txt
      - name: 실행 환경
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist-packages/linux-x64/*.deb webkit2gtk-driver libssl-dev xvfb dbus-x11 openbox fonts-noto-cjk pulseaudio
          cargo install tauri-driver --locked
      - name: Debian 설치본 검사
        env:
          LINUX_LIVE_PROBE: '1'
        run: |
          dbus-run-session -- xvfb-run -a bash -c 'openbox & pulseaudio --start --exit-idle-time=-1; pactl load-module module-null-sink sink_name=radio-test; node scripts/linux-smoke.mjs /usr/bin/motungi-radio deb'
      - name: AppImage 실행 검사
        env:
          LINUX_LIVE_PROBE: '1'
        run: |
          chmod +x dist-packages/linux-x64/*.AppImage
          dbus-run-session -- xvfb-run -a bash -c 'openbox & node scripts/linux-smoke.mjs dist-packages/linux-x64/motungi-radio-0.2.1-linux-x64.AppImage appimage'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-runtime-proof-${{ inputs.build_run }}
          path: dist-packages/linux-x64/proof/
          if-no-files-found: warn

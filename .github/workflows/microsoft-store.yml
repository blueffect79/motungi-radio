name: Microsoft Store MSIX
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target-microsoft-store
          cache-on-failure: true
      - run: npm run verify
      - run: npm run test:distribution
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features microsoft-store
      - run: npm run desktop:microsoft-store -- --target x86_64-pc-windows-msvc --no-bundle
      - run: cargo tree --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features microsoft-store | Out-File store-dependencies.txt
      - name: Check native distribution boundary
        shell: pwsh
        run: |
          if (Select-String -Path store-dependencies.txt -Pattern 'tauri-plugin-(updater|autostart)') { throw 'Direct distribution dependency in Store build' }
      - name: Build other frontend variants and verify update boundary
        run: |
          npm run build:appstore
          npm run build
          node scripts/check-distribution-bundles.mjs
      - name: Package unsigned MSIX for Store submission
        shell: pwsh
        run: ./scripts/package-msix.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: motungi-radio-msix-${{ github.sha }}
          path: dist-packages/microsoft-store/output/
          if-no-files-found: error
          retention-days: 14

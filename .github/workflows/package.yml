name: 설치파일 검증 빌드
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 빌드할 운영체제
        type: choice
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, runner: macos-15, target: aarch64-apple-darwin, bundle: dmg, name: macos-arm64 }
          - { platform: macos, runner: macos-15-intel, target: x86_64-apple-darwin, bundle: dmg, name: macos-x64 }
          - { platform: windows, runner: windows-2025, target: x86_64-pc-windows-msvc, bundle: nsis, name: windows-x64 }
          - { platform: linux, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundle: "deb,appimage", name: linux-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          node-version: '22'
          cache: npm
      - name: Linux 시스템 라이브러리
        if: matrix.platform == 'linux' && (inputs.platform == 'all' || inputs.platform == 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libfuse2 xvfb dbus-x11 openbox webkit2gtk-driver fonts-noto-cjk
      - name: 의존성 및 패키지 사전검증
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: |
          npm ci
          node scripts/check-package.mjs
          node --test scripts/check-binary-architecture.test.mjs
      - name: Rust stable 준비
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: 프런트엔드 검증
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: npm run verify
      - name: 네이티브 단위검증
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: 설치파일 빌드
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: 설치파일 형식 및 SHA256 검증
        id: packages
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: node scripts/package-artifacts.mjs ${{ matrix.target }} src-tauri/target/${{ matrix.target }}/release/bundle dist-packages/${{ matrix.name }}
      - name: Linux 설치 및 가상 화면 실행 검사
        if: matrix.platform == 'linux' && (inputs.platform == 'all' || inputs.platform == 'linux')
        run: |
          sudo apt-get install -y ./dist-packages/linux-x64/*.deb
          cargo install tauri-driver --locked
          dbus-run-session -- xvfb-run -a bash -c 'openbox & node scripts/linux-smoke.mjs /usr/bin/motungi-radio'
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.packages.outcome == 'success'
        with:
          name: motungi-radio-${{ matrix.name }}-${{ github.sha }}
          path: dist-packages/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 14
